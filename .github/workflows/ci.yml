name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only one deploy at a time; a newer push cancels an older run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for story tests
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm lint
      - run: pnpm exec tsc -b

      # Every story as a test: render, play functions (interaction + keyboard), axe a11y.
      # Visual screenshots (pnpm test:visual) are macOS baselines and run locally only.
      - run: pnpm test

      - run: pnpm build-storybook

      - name: Upload Storybook for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
